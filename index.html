<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FMB – Redirecting...</title>

  <!-- =====================================================
       🔗 CHANGE THE DESTINATION URL HERE
       Edit the line below to update where this page redirects.
       You can do this directly on GitHub by clicking the pencil ✏️ icon.
       ===================================================== -->
  <script>
    var TARGET_URL = "https://example.com"; // ← EDIT THIS LINE
  </script>
  <!-- ===================================================== -->

  <!-- Fallback redirect for browsers with JavaScript disabled -->
  <noscript>
    <meta http-equiv="refresh" content="3;url=https://example.com" />
  </noscript>

  <!-- SEO & Social Sharing -->
  <meta name="description" content="You are being redirected. Please wait a moment." />
  <meta name="robots" content="noindex, follow" />

  <!-- Open Graph -->
  <meta property="og:title" content="FMB" />
  <meta property="og:description" content="You are being redirected to our official page." />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="FMB" />
  <meta name="twitter:description" content="You are being redirected to our official page." />

  <style>
    /* ── Google Font ── */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-start:    #0d1117;
      --bg-end:      #161b25;
      --accent:      #4f9cf9;
      --accent-glow: rgba(79, 156, 249, 0.35);
      --text-main:   #e6edf3;
      --text-muted:  #8b949e;
      --card-bg:     rgba(22, 27, 37, 0.85);
      --border:      rgba(255, 255, 255, 0.07);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text-main);
      overflow: hidden;
      position: relative;
    }

    /* ── Ambient orbs ── */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: float 8s ease-in-out infinite alternate;
    }
    body::before {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(79,156,249,0.18) 0%, transparent 70%);
      top: -10%;
      left: -10%;
    }
    body::after {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
      bottom: -10%;
      right: -10%;
      animation-delay: -4s;
    }
    @keyframes float {
      from { transform: translate(0, 0) scale(1);   }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 56px 48px 48px;
      text-align: center;
      width: min(420px, 90vw);
      backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 32px 64px rgba(0,0,0,0.5),
        0 0 48px var(--accent-glow);
      animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    /* ── Logo / Brand ── */
    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
      box-shadow: 0 8px 32px var(--accent-glow);
      margin-bottom: 24px;
    }
    .brand-badge span {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: #fff;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 36px;
      line-height: 1.5;
    }

    /* ── Spinner ── */
    .spinner-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Progress bar ── */
    .progress-track {
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), #7c3aed);
      transition: width 0.1s linear;
    }

    /* ── Countdown ── */
    .countdown-text {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .countdown-text strong {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* ── Footer note ── */
    .footer-note {
      margin-top: 32px;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-badge"><span>FMB</span></div>
    <h1>Redirecting you…</h1>
    <p class="subtitle">Taking you to our official page.<br>Please hold on for just a moment.</p>

    <div class="spinner-wrap">
      <div class="spinner" role="status" aria-label="Loading"></div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <p class="countdown-text">Redirecting in <strong id="countdown">3</strong> seconds…</p>

    <p class="footer-note">If you are not redirected automatically,
      <a href="#" id="manualLink" style="color:var(--accent);text-decoration:none;">click here</a>.
    </p>
  </div>

  <script>
    // ── Redirect logic ──────────────────────────────────────
    var DELAY_MS  = 3000;   // milliseconds before redirect
    var startTime = Date.now();

    document.getElementById('manualLink').href = TARGET_URL;

    var countdownEl  = document.getElementById('countdown');
    var progressEl   = document.getElementById('progressFill');
    var secondsLeft  = Math.ceil(DELAY_MS / 1000);

    var timer = setInterval(function () {
      var elapsed = Date.now() - startTime;
      var pct     = Math.min((elapsed / DELAY_MS) * 100, 100);

      progressEl.style.width = pct + '%';
      secondsLeft = Math.max(Math.ceil((DELAY_MS - elapsed) / 1000), 0);
      countdownEl.textContent = secondsLeft;

      if (elapsed >= DELAY_MS) {
        clearInterval(timer);
        window.location.replace(TARGET_URL);
      }
    }, 50);
    // ────────────────────────────────────────────────────────
  </script>

</body>
</html>
